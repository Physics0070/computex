# Render blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then New > Blueprint in the Render dashboard.
# Secrets are marked sync:false so Render prompts for them instead of storing
# them in git.
services:
  - type: web
    name: computex
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: X402_FACILITATOR_URL
        value: https://facilitator.goplausible.xyz
      - key: ALGOD_URL
        value: https://testnet-api.algonode.cloud
      - key: INDEXER_URL
        value: https://testnet-idx.algonode.cloud
      # Per-job ceiling and rate limit for the shared demo payer.
      - key: MAX_JOB_PRICE_USDC
        value: "0.50"
      - key: RATE_LIMIT_MAX_JOBS
        value: "10"
      # --- set these in the dashboard ---
      - key: PAYEE_ADDRESS
        sync: false
      - key: PAYER_MNEMONIC
        sync: false
      # Optional: require x-computex-token on the payer proxy.
      - key: DEMO_ACCESS_TOKEN
        sync: false
